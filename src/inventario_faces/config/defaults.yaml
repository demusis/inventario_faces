app:
  name: "Inventario Faces"
  output_directory_name: "inventario_faces_output"
  report_title: "Relat\u00f3rio Forense de Invent\u00e1rio Facial"
  organization: "Laborat\u00f3rio de An\u00e1lise Digital"
  log_level: "INFO"
  use_local_temp_copy: false

media:
  image_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".bmp"
    - ".tif"
    - ".tiff"
    - ".webp"
  video_extensions:
    - ".mp4"
    - ".avi"
    - ".mkv"
    - ".dav"
    - ".mov"
    - ".wmv"
    - ".mpeg"
    - ".mpg"

video:
  # Padrao pericial: cobertura temporal mais densa, sem truncamento silencioso de videos longos.
  sampling_interval_seconds: 1.0
  # Use null para percorrer o video inteiro conforme o intervalo de amostragem.
  max_frames_per_video: null
  # Distancia temporal minima entre keyframes consecutivos do mesmo track.
  keyframe_interval_seconds: 3.0
  # Limiar um pouco mais sensivel para registrar mudancas relevantes com maior auditabilidade.
  significant_change_threshold: 0.15

comparison:
  # Ajustes especificos da comparacao Padrao x Questionado. Por padrao (null/null) a
  # comparacao herda integralmente a amostragem global de 'video', preservando a
  # cobertura temporal pericial. Defina um teto para limitar o tempo em videos longos
  # (menor cobertura, escolha explicita e registrada nos logs/relatorios).
  max_frames_per_video: null
  # Intervalo de amostragem (segundos) so para a comparacao. null = herda video.sampling_interval_seconds.
  sampling_interval_seconds: null
  # Politica do veredito por midia do Questionado QUANDO ha calibracao LR: a midia e
  # atribuida ao individuo de referencia se algum par atinge log10(LR) >= este valor
  # (4.0 = LR >= 10^4, suporte forte). Sem calibracao, recai nas faixas de similaridade.
  verdict_assignment_log10_lr: 4.0
  # Midia fica como candidata se algum par atinge log10(LR) >= este valor
  # (1.0 = LR >= 10, suporte moderado). Deve ser <= verdict_assignment_log10_lr.
  verdict_candidate_log10_lr: 1.0

face_model:
  # Backends aceitos: "insightface" (com fallback automatico para onnx) ou
  # "onnx" (ONNX Runtime direto, sem o pacote insightface; mesmos modelos e
  # embeddings equivalentes).
  backend: "insightface"
  model_name: "buffalo_l"
  # Padrao pericial: preferir aceleracao por GPU quando disponivel, com fallback automatico para CPU.
  det_size:
    - 800
    - 800
  minimum_face_quality: 0.68
  minimum_face_size_pixels: 48
  ctx_id: 0
  # Lista vazia = descoberta automatica (CUDA -> DirectML -> CPU), preferindo GPU com
  # fallback para CPU. Para ativar o TensorRT (opt-in, ~1.5-3x sobre CUDA, mas com
  # warm-up longo de build de engine e menos estavel), liste-o explicitamente, por ex.:
  # ["TensorrtExecutionProvider", "CUDAExecutionProvider", "CPUExecutionProvider"].
  providers: []

clustering:
  # Padrao pericial: thresholds mais conservadores para reduzir fusoes indevidas.
  assignment_similarity: 0.62
  # Similaridade a partir da qual grupos distintos viram sugestao de revisao.
  candidate_similarity: 0.56
  # Quantidade minima de tracks para um grupo aparecer na saida final.
  min_cluster_size: 1
  # Quantidade minima de ocorrencias para um track entrar no clustering.
  min_track_size: 1

tracking:
  # Padrao pericial: maior exigencia de identidade e maior cautela na associacao temporal.
  iou_threshold: 0.10
  spatial_distance_threshold: 0.15
  embedding_similarity_threshold: 0.58
  minimum_total_match_score: 0.45
  geometry_weight: 0.35
  embedding_weight: 0.65
  max_missed_detections: 2
  confidence_margin: 0.08
  representative_embeddings_per_track: 8
  top_crops_per_track: 6
  quality_improvement_margin: 0.04

enhancement:
  enable_preprocessing: true
  # Padrao pericial: realce moderado e auditavel, aplicado apenas sobre derivados.
  minimum_brightness_to_enhance: 0.40
  clahe_clip_limit: 2.0
  clahe_tile_grid_size: 8
  gamma: 1.10
  denoise_strength: 2

search:
  enabled: true
  prefer_faiss: true
  coarse_top_k: 12
  refine_top_k: 20

likelihood_ratio:
  # Quantidade maxima de scores amostrados em cada distribuicao da calibracao LR.
  max_scores_per_distribution: 20000
  # Numero minimo de identidades com faces validas para autorizar o ajuste.
  minimum_identities_with_faces: 2
  # Minimos de scores para ajustar as densidades de mesma origem e origem distinta.
  minimum_same_source_scores: 5
  minimum_different_source_scores: 5
  # Quantidade minima de valores distintos em cada distribuicao para evitar KDE degenerada.
  minimum_unique_scores_per_distribution: 2
  # Estimador de densidade nao parametrico usado no LR: bounded_logit_kde ou gaussian_kde.
  density_estimator: bounded_logit_kde
  # Fator multiplicativo da largura de banda Scott da gaussian_kde.
  kde_bandwidth_scale: 1.0
  # Peso do piso uniforme misturado a cada densidade para evitar zeros numericos.
  kde_uniform_floor_weight: 0.001
  # Densidade minima absoluta aceita apos a estabilizacao.
  kde_min_density: 1.0e-12

distributed:
  enabled: false
  execution_label: "compartilhado"
  node_name: null
  # Frequencia dos heartbeats gravados pelo no no lote compartilhado.
  heartbeat_interval_seconds: 10
  # Janela para considerar lock/heartbeat abandonado e permitir retomada.
  stale_lock_timeout_minutes: 180
  # Quando true, a instancia que perceber o lote completo tenta consolidar o resultado final.
  auto_finalize: true
  # Valida existencia, consistencia estrutural e hash interno dos parciais antes da consolidacao.
  validate_partial_integrity: true
  # Reprocessa automaticamente apenas os parciais ausentes/corrompidos detectados na validacao.
  auto_reprocess_invalid_partials: true

reporting:
  compile_pdf: true
  # Padrao pericial: maior densidade de detalhamento por grupo.
  max_tracks_per_group: 12

forensics:
  chain_of_custody_note: "Os arquivos originais nao foram alterados. Todos os hashes SHA-512 foram calculados em modo somente leitura, as derivacoes foram armazenadas separadamente para auditoria e os resultados de deteccao, agrupamento e busca devem ser interpretados como probabilisticos, sujeitos a revisao tecnica pericial."
